server:
  port: 8050
spring:
  application:
    name: kaldar
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATA_BASE_URL:jdbc:postgresql://${DATA_BASE_HOST}:${DATA_BASE_PORT:5432}/${DATA_BASE_NAME}}
    hikari:
      username: ${DATA_BASE_USERNAME:postgres}
      password: ${DATA_BASE_PASSWORD:122024Clux!}
  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from-name: "Kaldar"
    from-email: ${MAIL_USERNAME}
  config:
    import: optional:classpath:secret.yml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

cloudinary:
  url: ${CLOUDINARY_URL:cloudinary://key:secret@cloud}

security:
  otp:
    digit: ${OTP_DIGIT:6}
    expiry-minutes: ${OTP_EXPIRATION:1}
jwt:
    secret:
      key: ${JWT_SECRET_KEY}

logistics:
  active-provider: ${LOGISTICS_PROVIDER:MOCK}
  chowdeck:
    api-key: ${CHOWDECK_API_KEY:}
    base-url: ${CHOWDECK_BASE_URL:https://api.chowdeck.com/relay}
    webhook-secret: ${CHOWDECK_WEBHOOK_SECRET:}
  uber:
    client-id: ${UBER_CLIENT_ID:}
    client-secret: ${UBER_CLIENT_SECRET:}

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:}
  base-url: https://api.paystack.co
