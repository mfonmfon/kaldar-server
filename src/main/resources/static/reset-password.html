<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; color: #2c3e50; }
        .container { max-width: 520px; margin: 0 auto; }
        label { display: block; margin-top: 12px; }
        input { width: 100%; padding: 10px; margin-top: 6px; }
        button { margin-top: 16px; padding: 10px 16px; }
        .error { color: #c0392b; margin-top: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Reset Password</h2>
    <p>Enter a new password to complete your reset.</p>
    <form id="resetForm">
        <label>Email</label>
        <input type="email" id="email" required />
        <label>Token</label>
        <input type="text" id="token" required />
        <label>New Password</label>
        <input type="password" id="newPassword" required />
        <button type="submit">Reset Password</button>
    </form>
    <div id="error" class="error"></div>
</div>
<script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get("email");
    const token = params.get("token");
    if (email) document.getElementById("email").value = email;
    if (token) document.getElementById("token").value = token;

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
            email: document.getElementById("email").value,
            token: document.getElementById("token").value,
            newPassword: document.getElementById("newPassword").value
        };
        const errorEl = document.getElementById("error");
        errorEl.textContent = "";
        try {
            const res = await fetch("/api/v1/auth/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            if (!res.ok) {
                const data = await res.json();
                errorEl.textContent = data.message || "Reset failed";
                return;
            }
            window.location.href = "/reset-password-confirmation.html";
        } catch (err) {
            errorEl.textContent = "Reset failed. Please try again.";
        }
    });
</script>
</body>
</html>
