openapi: 3.0.3
info:
  title: Kaldar Platform API Documentation
  description: |
    Complete Production REST API specification for the Kaldar Monorepo (Laundry & Dry Cleaning Platform).
    
    ### Full API Inventory (55 Endpoints across 14 Controllers):
    1. **Authentication & Verification**: Login, OTP verification & resending, Forgot Password, Reset Password.
    2. **Customer**: Registration, profile fetch, update profile, change password, delete customer account.
    3. **Dry Cleaner Store & Ops**: Registration, profile edit, CAC business verification & status check, service inventory management, payout bank account setup, working hours schedule, onboarding checklist status, analytics metrics, delete dry cleaner account.
    4. **Payout**: Bank account verification, earnings withdrawal to registered bank (Anchor Banking).
    5. **Discovery**: Geospatial discovery of nearby available dry cleaners.
    6. **Order Management**: Create order, accept order, reject order, order status progression, fetch order details, customer order history, dry cleaner order queue.
    7. **Review & Ratings**: Submit review, dry cleaner store reviews list, single order review fetch.
    8. **Logistics & Dispatch**: Delivery partner webhook callbacks (Chowdeck, Uber Direct, etc.).
    9. **Notification Center**: Paginated notifications list, toggle read status, delete single, bulk mark read/unread/delete, mark all read.
    10. **Favourites**: Customer saved dry cleaners list, add to favourites, remove from favourites.
    11. **Wallet & Anchor Banking**: Customer wallet balance, virtual bank account details, user wallet summary & transaction history, internal credit & debit, Anchor deposit webhook callback.
    12. **Payment (Paystack)**: Wallet top-up initiation, HMAC-SHA512 webhook callback, transaction history.
  version: 1.0.0
  contact:
    name: Kaldar Engineering Team
    email: engineering@kaldar.com

servers:
  - url: http://localhost:8080
    description: Local Development Server
  - url: https://kaldar-server.onrender.com
    description: Production / Staging Server (Render)

security:
  - bearerAuth: []

tags:
  - name: Authentication
  - name: Customer
  - name: DryCleaner
  - name: Payout
  - name: Discovery
  - name: Order
  - name: Review
  - name: Logistics
  - name: Notifications
  - name: Favorites
  - name: Wallet
  - name: Payment

paths:

  # =========================================================================
  # 1. AUTHENTICATION & VERIFICATION (5 Endpoints)
  # =========================================================================
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: User Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: "customer@kaldar.com" }
                password: { type: string, example: "Password123!" }
      responses:
        '200': { description: Login successful, returns JWT bearer token }

  /api/v1/auth/verify-otp:
    post:
      tags: [Authentication]
      summary: Verify Account Email OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otpInput]
              properties:
                email: { type: string, example: "customer@kaldar.com" }
                otpInput: { type: string, example: "123456" }
      responses:
        '200': { description: OTP verified }

  /api/v1/auth/resendOtp:
    post:
      tags: [Authentication]
      summary: Resend Verification OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, example: "customer@kaldar.com" }
      responses:
        '200': { description: OTP resent }

  /api/v1/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request Password Reset Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, example: "user@kaldar.com" }
      responses:
        '200': { description: Reset token sent }

  /api/v1/auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset Password using Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, resetToken, newPassword]
              properties:
                email: { type: string }
                resetToken: { type: string }
                newPassword: { type: string }
      responses:
        '200': { description: Password reset successfully }

  # =========================================================================
  # 2. CUSTOMER MODULE (5 Endpoints)
  # =========================================================================
  /api/v1/customer/register:
    post:
      tags: [Customer]
      summary: Register Customer Account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password, phoneNumber]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string }
                password: { type: string }
                phoneNumber: { type: string }
                address: { type: string }
      responses:
        '201': { description: Customer registered }

  /api/v1/customer/updated_customer_profile:
    put:
      tags: [Customer]
      summary: Update Customer Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string }
                lastName: { type: string }
                phoneNumber: { type: string }
                address: { type: string }
      responses:
        '200': { description: Profile updated }

  /api/v1/customer/{customerId}:
    get:
      tags: [Customer]
      summary: Get Customer Profile
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Profile retrieved }
    delete:
      tags: [Customer]
      summary: Delete Customer Account
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Customer account deleted successfully }
        '404': { description: Customer not found }

  /api/v1/customer/change_password:
    put:
      tags: [Customer]
      summary: Change Customer Password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string }
                newPassword: { type: string }
      responses:
        '200': { description: Password updated }

  # =========================================================================
  # 3. DRY CLEANER & PAYOUT MODULE (12 Endpoints)
  # =========================================================================
  /api/v1/drycleaner/drycleaner/register:
    post:
      tags: [DryCleaner]
      summary: Register Dry Cleaner Store
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessName, email, password, phoneNumber, address]
              properties:
                businessName: { type: string }
                email: { type: string }
                password: { type: string }
                phoneNumber: { type: string }
                address: { type: string }
      responses:
        '201': { description: Dry cleaner registered }

  /api/v1/drycleaner/drycleaner/edit-profile:
    patch:
      tags: [DryCleaner]
      summary: Edit Dry Cleaner Store Profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Profile edited }

  /api/v1/drycleaner/drycleaner/verify-business:
    post:
      tags: [DryCleaner]
      summary: Submit CAC Business Verification
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data: { type: object }
                cacDocument: { type: string, format: binary }
      responses:
        '201': { description: Verification submitted }

  /api/v1/drycleaner/drycleaner/{dryCleanerId}/verification-status:
    get:
      tags: [DryCleaner]
      summary: Get CAC Verification Status
      parameters:
        - name: dryCleanerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Status retrieved }

  /api/v1/drycleaner/drycleaner/{dryCleanerId}/services:
    get:
      tags: [DryCleaner]
      summary: Get Dry Cleaner Services Offering List
      parameters:
        - name: dryCleanerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Services list }
    post:
      tags: [DryCleaner]
      summary: Add or Update Service Offering
      parameters:
        - name: dryCleanerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceName, price]
              properties:
                serviceName: { type: string }
                price: { type: number }
      responses:
        '201': { description: Service offering added/updated }

  /api/v1/drycleaner/drycleaner/payout-account:
    post:
      tags: [DryCleaner]
      summary: Update Bank Payout Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dryCleanerId, accountName, accountNumber, bankCode, bankName]
              properties:
                dryCleanerId: { type: integer }
                accountName: { type: string }
                accountNumber: { type: string }
                bankCode: { type: string }
                bankName: { type: string }
      responses:
        '200': { description: Payout account saved }

  /api/v1/drycleaner/drycleaner/working-hours:
    post:
      tags: [DryCleaner]
      summary: Update Store Working Hours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dryCleanerId, workingHoursJson]
              properties:
                dryCleanerId: { type: integer }
                workingHoursJson: { type: string }
      responses:
        '200': { description: Working hours saved }

  /api/v1/drycleaner/drycleaner/{dryCleanerId}/onboarding-status:
    get:
      tags: [DryCleaner]
      summary: Get Onboarding Checklist Progress
      parameters:
        - name: dryCleanerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Onboarding status fetched }

  /api/v1/drycleaner/drycleaner/{dryCleanerId}/analytics:
    get:
      tags: [DryCleaner]
      summary: Get Store Performance Analytics
      parameters:
        - name: dryCleanerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: period
          in: query
          schema: { type: string, default: "today" }
      responses:
        '200': { description: Analytics metrics fetched }

  /api/v1/drycleaner/drycleaner/{dryCleanerId}:
    delete:
      tags: [DryCleaner]
      summary: Delete Dry Cleaner Account
      parameters:
        - name: dryCleanerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Dry cleaner account deleted successfully }
        '404': { description: Dry cleaner not found }

  /api/v1/drycleaner/payout/verify-account:
    get:
      tags: [Payout]
      summary: Verify Bank Account Number with Paystack Payout
      parameters:
        - name: accountNumber
          in: query
          required: true
          schema: { type: string }
        - name: bankCode
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Bank account name verified }

  /api/v1/drycleaner/payout/withdraw:
    post:
      tags: [Payout]
      summary: Withdraw Store Earnings to Registered Bank Account (Anchor Banking)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dryCleanerId, amount]
              properties:
                dryCleanerId: { type: integer, format: int64, example: 1 }
                amount: { type: number, format: double, example: 15000.00 }
      responses:
        '200': { description: Withdrawal initiated }
        '422': { description: Payout bank account not configured }
        '400': { description: Insufficient wallet balance }

  # =========================================================================
  # 4. DISCOVERY MODULE (1 Endpoint)
  # =========================================================================
  /api/v1/drycleaners:
    get:
      tags: [Discovery]
      summary: Search Nearby Available Dry Cleaners (Geospatial)
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double }
        - name: lng
          in: query
          required: true
          schema: { type: number, format: double }
        - name: radiusKm
          in: query
          required: true
          schema: { type: number, format: double, default: 10.0 }
        - name: openNow
          in: query
          schema: { type: boolean }
      responses:
        '200': { description: Available dry cleaners nearby }

  # =========================================================================
  # 5. ORDER & REVIEW MODULE (10 Endpoints)
  # =========================================================================
  /api/v1/order/create-order:
    post:
      tags: [Order]
      summary: Create New Order
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Order created }

  /api/v1/order:
    post:
      tags: [Order]
      summary: Place Order (Customer)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Order placed }

  /api/v1/order/accept:
    post:
      tags: [Order]
      summary: Accept Order (Dry Cleaner)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Order accepted }

  /api/v1/order/reject:
    post:
      tags: [Order]
      summary: Reject Order (Dry Cleaner)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Order rejected }

  /api/v1/order/status:
    put:
      tags: [Order]
      summary: Update Order Status Progression
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Order status updated }

  /api/v1/order/{orderId}:
    get:
      tags: [Order]
      summary: Get Order Details
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Order details }

  /api/v1/order/customer/{customerId}:
    get:
      tags: [Order]
      summary: Get Customer Order History
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Customer order list }

  /api/v1/order/drycleaner/{dryCleanerId}:
    get:
      tags: [Order]
      summary: Get Dry Cleaner Order Queue
      parameters:
        - name: dryCleanerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Dry cleaner order queue }

  /api/v1/order/review:
    post:
      tags: [Review]
      summary: Submit Order Review & Rating
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '201': { description: Review submitted }

  /api/v1/order/review/drycleaner/{dryCleanerId}:
    get:
      tags: [Review]
      summary: Get Reviews for Dry Cleaner Store
      parameters:
        - name: dryCleanerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Store reviews list }

  /api/v1/order/review/{orderId}:
    get:
      tags: [Review]
      summary: Get Single Order Review
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Review details }

  # =========================================================================
  # 6. LOGISTICS DISPATCH MODULE (1 Endpoint)
  # =========================================================================
  /api/v1/logistics/webhook/{provider}:
    post:
      tags: [Logistics]
      summary: Delivery Provider Webhook Callback (Chowdeck / Uber Direct)
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, example: "chowdeck" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Logistics webhook processed }

  # =========================================================================
  # 7. NOTIFICATION MODULE (7 Endpoints)
  # =========================================================================
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: Get User Notifications (Paginated)
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: type
          in: query
          schema: { type: string }
        - name: read
          in: query
          schema: { type: boolean }
      responses:
        '200': { description: Notifications list }

  /api/v1/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Toggle Notification Read Status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isRead: { type: boolean }
      responses:
        '200': { description: Read status updated }

  /api/v1/notifications/{id}:
    delete:
      tags: [Notifications]
      summary: Delete Notification
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Notification deleted }

  /api/v1/notifications/bulk/read:
    post:
      tags: [Notifications]
      summary: Bulk Mark Notifications Read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: integer } }
      responses:
        '200': { description: Bulk read completed }

  /api/v1/notifications/bulk/unread:
    post:
      tags: [Notifications]
      summary: Bulk Mark Notifications Unread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: integer } }
      responses:
        '200': { description: Bulk unread completed }

  /api/v1/notifications/bulk/delete:
    post:
      tags: [Notifications]
      summary: Bulk Delete Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: integer } }
      responses:
        '200': { description: Bulk delete completed }

  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark All Notifications Read
      responses:
        '200': { description: All marked read }

  # =========================================================================
  # 8. FAVOURITES MODULE (3 Endpoints)
  # =========================================================================
  /api/v1/favorites:
    get:
      tags: [Favorites]
      summary: Get Customer Saved Favourite Dry Cleaners
      responses:
        '200': { description: Favourites list retrieved }
    post:
      tags: [Favorites]
      summary: Add Dry Cleaner to Favourites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dryCleanerId]
              properties:
                dryCleanerId: { type: integer, format: int64 }
      responses:
        '201': { description: Added to favourites }

  /api/v1/favorites/{dryCleanerId}:
    delete:
      tags: [Favorites]
      summary: Remove Dry Cleaner from Favourites
      parameters:
        - name: dryCleanerId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Removed from favourites }

  # =========================================================================
  # 9. WALLET & ANCHOR BANKING MODULE (5 Endpoints)
  # =========================================================================
  /api/v1/wallet/balance:
    get:
      tags: [Wallet]
      summary: Get Wallet Balance & Virtual Bank Account Details
      responses:
        '200': { description: Wallet balance and virtual account details retrieved }

  /api/v1/wallet/summary:
    get:
      tags: [Wallet]
      summary: Get Wallet Balance & Recent Transaction History
      responses:
        '200': { description: Summary and top 50 transactions retrieved }

  /api/v1/wallet/credit:
    post:
      tags: [Wallet]
      summary: Internal Wallet Credit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, amount, description, reference]
              properties:
                userId: { type: integer, format: int64 }
                amount: { type: number }
                description: { type: string }
                reference: { type: string }
      responses:
        '200': { description: Wallet credited }

  /api/v1/wallet/debit:
    post:
      tags: [Wallet]
      summary: Internal Wallet Debit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, amount, description, reference]
              properties:
                userId: { type: integer, format: int64 }
                amount: { type: number }
                description: { type: string }
                reference: { type: string }
      responses:
        '200': { description: Wallet debited }

  /api/v1/anchor/webhook:
    post:
      tags: [Wallet]
      summary: Anchor Virtual Account Bank Transfer Deposit Webhook
      security: []
      parameters:
        - name: x-anchor-signature
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string, example: "deposit.successful" }
                data: { type: object }
      responses:
        '200': { description: Webhook processed }
        '401': { description: Invalid HMAC signature }

  # =========================================================================
  # 10. PAYMENT (PAYSTACK) MODULE (3 Endpoints)
  # =========================================================================
  /api/v1/payment/initiate:
    post:
      tags: [Payment]
      summary: Initiate Paystack Card / Bank Payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, amount]
              properties:
                email: { type: string }
                amount: { type: number }
      responses:
        '200': { description: Payment authorization URL returned }

  /api/v1/payment/webhook:
    post:
      tags: [Payment]
      summary: Paystack Payment Webhook Callback
      security: []
      parameters:
        - name: x-paystack-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Paystack webhook processed }

  /api/v1/payment/history:
    get:
      tags: [Payment]
      summary: Get Payment Transaction History
      responses:
        '200': { description: Payment history retrieved }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
